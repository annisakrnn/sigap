<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSigap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="60%" stop-color="#00529b"/>
      <stop offset="100%" stop-color="#0072ce"/>
    </linearGradient>
    <linearGradient id="glowSigap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="180" fill="url(#bgSigap)"/>
  
  <!-- Subtle pattern grid -->
  <line x1="0" y1="45" x2="320" y2="45" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="0" y1="95" x2="320" y2="95" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="0" y1="145" x2="320" y2="145" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Left Side: Badge SIGAP & K3 -->
  <g transform="translate(16, 22)">
    <!-- Badge Container -->
    <rect x="8" y="6" width="72" height="92" rx="8" fill="rgba(255,255,255,0.12)" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Shield / Lightning Symbol -->
    <rect x="22" y="16" width="44" height="44" rx="22" fill="#0072ce"/>
    <path d="M 46 22 L 34 40 L 43 40 L 40 54 L 54 36 L 45 36 Z" fill="#ffd100" stroke="#ffb700" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Checkmark Badge -->
    <circle cx="58" cy="52" r="8" fill="#10b981"/>
    <path d="M 54 52 L 57 55 L 62 49" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Branding Text Under Badge -->
    <text x="44" y="114" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="1.2">SIGAP</text>
    <text x="44" y="128" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="800" letter-spacing="0.5">GELAR ALAT &amp; K3</text>
    <text x="44" y="139" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="6.5">PLN UP3 &amp; ULP</text>
  </g>

  <!-- Right Side: Checklist Card Mockup -->
  <g transform="translate(122, 18)">
    <rect width="180" height="144" rx="8" fill="#ffffff" filter="drop-shadow(0 8px 20px rgba(0,0,0,0.3))"/>
    
    <!-- Accent line -->
    <rect width="180" height="4" rx="2" fill="url(#glowSigap)"/>

    <!-- Title -->
    <text x="90" y="24" text-anchor="middle" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">Form Gelar Alat &amp; K3</text>
    <text x="90" y="37" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="7.5">Pemeriksaan Alat &amp; Berita Acara</text>

    <!-- Regu / Jenis Selector -->
    <rect x="18" y="46" width="144" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="28" y="59" fill="#1e40af" font-family="sans-serif" font-size="7.5" font-weight="600">&#9889; P2TL &bull; YANDAL &bull; HAR &bull; SR</text>

    <!-- Checklist Item Row Mockup -->
    <rect x="18" y="72" width="144" height="20" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="28" cy="82" r="4" fill="#10b981"/>
    <text x="38" y="85" fill="#334155" font-family="sans-serif" font-size="7.5" font-weight="600">Alat Kerja &amp; APD: LENGKAP</text>

    <!-- Button Buka -->
    <rect x="18" y="100" width="144" height="22" rx="4" fill="#0284c7"/>
    <text x="90" y="114" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold">MASUK SIGAP &gt;</text>

    <!-- Domain Footer -->
    <text x="90" y="135" text-anchor="middle" fill="#0284c7" font-family="monospace" font-size="6.8">jaringanponorogo.com/sigap</text>
  </g>
</svg>
